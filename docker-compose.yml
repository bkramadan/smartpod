# Local PostgreSQL database for development. Start: `docker compose up -d`. Stop: `docker compose down`.
# Settings come from the .env file next to this one (copy .env.example to .env first).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # 127.0.0.1 = reachable only from this computer, not from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
